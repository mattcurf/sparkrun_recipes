# SPDX-License-Identifier: Apache-2.0
# Adapted from christopherowen/spark-ds41f, releases/spark-ds41f-1107/cluster.json.
# Site-specific fabric and local-NVMe mounts must be supplied before launch.
recipe_version: "2"
model: deepseek-ai/DeepSeek-V4.1-Flash-1017
model_revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
runtime: vllm-distributed
container: spark-ds41f:1107
min_nodes: 4
max_nodes: 4
cluster_only: true
runtime_cache:
  enabled: false
metadata:
  description: DeepSeek 1017, spark-ds41f-1107 TileLang, switched TP4, disk Engram, DSpark, 1M context
  quantization: mxfp4
  quant_bits: 4
  model_vram: 310
  recipe_revision: cc20ed18be1f7cbf5c6c53cdee945f7cc77d5fc5
mods:
  - use-official-vllm
executor_config:
  entrypoint: ""
  user: root
  privileged: false
  gpu_access_mode: gpus
  ipc: host
  network: host
  auto_remove: false
  shm_size: 16g
  memory_limit: 112g
  security_opt: [seccomp=unconfined, label=disable]
  cap_add: [IPC_LOCK]
  ulimit: [memlock=-1:-1, stack=67108864:67108864, core=0]
  devices: [/dev/infiniband:/dev/infiniband]
distribution_config:
  externally_provided: true
  models:
    enabled: false
    entries: []
  containers:
    enabled: false
    entries: []
defaults:
  host: 0.0.0.0
  port: 8000
  served_model_name: deepseek-v4.1-flash-1017-mxfp4-tp4
  tensor_parallel: 4
  gpu_memory_utilization: 0.82
  max_model_len: 1048576
  max_num_seqs: 16
  max_num_batched_tokens: 16384
  # Reserve allocation headroom: the local 10.5-GiB trial failed at warmup.
  # Six GiB passed startup and serving checks without changing model arithmetic.
  kv_cache_memory_bytes: 6442450944
  # Capture ladder and prefill threshold follow the pinned 16-sequence profile.
  # Change these together if changing sequences or speculative depth.
  speculative_config: '{"method":"dspark","num_speculative_tokens":5,"draft_tensor_parallel_size":4,"attention_backend":"TILELANG","draft_sample_method":"greedy","rejection_sample_method":"block","enable_adaptive_verification":true,"adaptive_verification_row_cost":0.035}'
  compilation_config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"],"cudagraph_capture_sizes":[1,2,3,4,6,8,12,16,20,24,28,32,40,48,56,64,72,80,88,96]}'
env:
  OMP_NUM_THREADS: "1"
  CUDA_CACHE_MAXSIZE: "4294967296"
  CUDA_CACHE_PATH: /cache/spark-ds41f/jit/nv-compute
  CUDA_DEVICE_MAX_CONNECTIONS: "32"
  DO_NOT_TRACK: "1"
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  MALLOC_ARENA_MAX: "2"
  MALLOC_MMAP_THRESHOLD_: "1048576"
  MAX_JOBS: "2"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,garbage_collection_threshold:0.6
  SAFETENSORS_FAST_GPU: "1"
  SPARKNET_ROCE_ALLREDUCE_CAPACITY_BYTES: "2097152"
  SPARKNET_ROCE_ALLREDUCE_DISPATCH_MAX_BYTES: "2097152"
  SPARKNET_ROCE_ALLGATHER_MAX_BYTES: "4194304"
  SPARKNET_ROCE_PROXY_CPU: big
  SPARKNET_ROCE_TIMEOUT_MS: "10000"
  SPARK_DS41F_DSPARK_DEAD_ROWS_TAU: "0.2"
  SPARK_DS41F_DSPARK_MAIN_PROJ_TP: "1"
  SPARK_DS41F_DSPARK_VOCAB_PARALLEL: "1"
  SPARK_DS41F_DISPLAY_CARVEOUT_WEIGHTS: "0"
  # Checkpoint/release-specific derived row layout, never beside read-only weights.
  SPARK_DS41F_ENGRAM_PACKED_DIR: /cache/spark-ds41f/engram/1017-1bae0e10-1107
  TILELANG_CACHE_DIR: /cache/spark-ds41f/jit/tilelang
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  TRANSFORMERS_OFFLINE: "1"
  TRITON_CACHE_DIR: /cache/spark-ds41f/jit/triton
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_CACHE_DIR: /cache/spark-ds41f/jit/vllm
  VLLM_CACHE_ROOT: /cache/spark-ds41f/jit/vllm
  VLLM_DISABLE_PYNCCL: "0"
  VLLM_DS41_HEAD_DTYPE: float32
  VLLM_DS41_PACKED_BF16_LM_HEAD: "1"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "900"
  VLLM_L2_PREFETCH_GRID: "2"
  VLLM_L2_PREFETCH_KERNELS: tilelang
  VLLM_LATE_ADMISSION_LAYER: "30"
  VLLM_MAX_IMAGE_PIXELS: "16777216"
  VLLM_NO_USAGE_STATS: "1"
  VLLM_PLUGINS: ""
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  XDG_CACHE_HOME: /cache/spark-ds41f/jit
  NCCL_BUFFSIZE: "1048576"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_DEBUG: WARN
  NCCL_DEBUG_SUBSYS: INIT
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_IB_MERGE_NICS: "1"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_SUBNET_AWARE_ROUTING: "1"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_LL128_BUFFSIZE: "262144"
  NCCL_MAX_NCHANNELS: "8"
  NCCL_NET: IB
  NCCL_NET_PLUGIN: none
  NCCL_NVLS_ENABLE: "0"
  NCCL_P2P_DISABLE: "1"
  NCCL_PROTO: ^LL128
  NCCL_SHM_DISABLE: "1"
command: |
  vllm serve {resolved_model_path} \
    --served-model-name {served_model_name} --host {host} --port {port} \
    --tokenizer-mode deepseek_v41 --dtype bfloat16 \
    --tensor-parallel-size {tensor_parallel} --load-format direct --block-size 256 \
    --enable-prefix-caching --enable-prompt-tokens-details --enable-chunked-prefill \
    --max-model-len {max_model_len} --max-num-seqs {max_num_seqs} \
    --max-parallel-prefills 1 --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-memory-bytes {kv_cache_memory_bytes} --max-cudagraph-capture-size 96 \
    --generation-config vllm --override-generation-config '{"temperature":1.0,"top_p":1.0}' \
    --engram-config '{"table_memory":"disk","disk_resident_scales":false,"projection_tp":true}' \
    --attention-backend TILELANG --linear-backend tilelang --moe-backend tilelang \
    --speculative-config '{speculative_config}' --jit-monitor-mode off \
    --compilation-config '{compilation_config}' --prefix-cache-retention-interval 8192 \
    --long-prefill-token-threshold 16288 --async-scheduling \
    --reasoning-parser deepseek_v41 --tool-call-parser deepseek_v41 --enable-auto-tool-choice \
    --distributed-executor-backend mp --no-scheduler-reserve-full-isl \
    --no-enable-flashinfer-autotune --limit-mm-per-prompt '{"image":16}' \
    --mm-processor-cache-gb 0 --prefill-yield short --prefill-yield-limit-s 10
