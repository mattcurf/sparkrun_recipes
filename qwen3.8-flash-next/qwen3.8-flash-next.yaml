recipe_version: "2"
model: Qwen/Qwen3.8-Flash-Next-FP8
runtime: vllm-distributed
container: vllm/vllm-openai@sha256:fc120ece0a388cc0aa1caad4a9f1cd92113484ab7ec2fd0efadd62585be05bf8
min_nodes: 2
max_nodes: 2

metadata:
  description: Original Qwen3.8-Flash-Next FP8 quant on two DGX Sparks using TP2, MTP3, and eager-mode vLLM

executor_config:
  entrypoint: ""
  # Avoid systemd RemoveIPC deleting rank-1's spawn semaphore when the
  # detached remote SSH launch exits.
  user: root

mods:
  - use-official-vllm

defaults:
  host: 0.0.0.0
  port: 8000
  served_model_name: Qwen3.8-Flash-Next-FP8
  tensor_parallel: 2
  gpu_memory_utilization: 0.88
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  kv_cache_dtype: auto
  load_format: instanttensor
  attention_backend: flashinfer
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --no-enable-flashinfer-autotune \
    --speculative-config '{speculative_config}' \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --trust-remote-code \
    --enforce-eager
