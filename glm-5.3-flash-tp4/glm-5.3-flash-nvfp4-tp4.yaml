# SPDX-License-Identifier: Unlicense
recipe_version: "2"
model: nvidia/GLM-5.3-Flash-NVFP4
model_revision: 423acf37583782c51c142d145aef733d72943d93
runtime: vllm-distributed
# Built by ../glm-5.3-flash-nvfp4/build-image.sh.
container: glm53-flash-nvfp4-sparkrun-v2
min_nodes: 4
max_nodes: 4
cluster_only: true
metadata:
  description: NVIDIA GLM-5.3-Flash NVFP4, four Sparks, TP4 + EP, DFlash2, FP8 KV, 256K context
  model_vram: 190.39
  kv_lora_rank: 512
mods:
  - use-official-vllm
executor_config:
  entrypoint: ""
  user: root
  shm_size: 32gb
distribution_config:
  models:
    entries:
      - name: nvidia/GLM-5.3-Flash-NVFP4
        target: [-1]
        revision: 423acf37583782c51c142d145aef733d72943d93
      - name: incoai/GLM-5.3-Flash-DFlash2
        target: [-1]
        revision: dc77ff1c99eeb2df044ee3d4f0094eb033fee410
defaults:
  host: 0.0.0.0
  port: 8000
  served_model_name: GLM-5.3-Flash-NVFP4-TP4
  revision: 423acf37583782c51c142d145aef733d72943d93
  tensor_parallel: 4
  gpu_memory_utilization: 0.80
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 8192
  kv_cache_dtype: fp8
  kv_cache_memory_bytes: 12884901888
  moe_backend: flashinfer_cutlass
  speculative_config: '{"method":"dflash","model":"incoai/GLM-5.3-Flash-DFlash2","revision":"dc77ff1c99eeb2df044ee3d4f0094eb033fee410","num_speculative_tokens":7,"kv_cache_dtype":"auto"}'
  execution_flags: --enforce-eager
env:
  VLLM_GLM53_CUDA_SPARSE_MLA: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_NO_USAGE_STATS: "1"
  DO_NOT_TRACK: "1"
command: |
  vllm serve {model} \
    --revision {revision} \
    --host {host} --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype {kv_cache_dtype} \
    --kv-cache-memory-bytes {kv_cache_memory_bytes} \
    --moe-backend {moe_backend} \
    --speculative-config '{speculative_config}' \
    --default-chat-template-kwargs '{"reasoning_effort":"low"}' \
    --load-format safetensors --safetensors-load-strategy lazy \
    --enable-expert-parallel --enable-ep-weight-filter \
    --all2all-backend allgather_reducescatter \
    --enable-chunked-prefill --no-enable-flashinfer-autotune \
    --reasoning-parser glm45 --tool-call-parser glm47 \
    --enable-auto-tool-choice {execution_flags}
