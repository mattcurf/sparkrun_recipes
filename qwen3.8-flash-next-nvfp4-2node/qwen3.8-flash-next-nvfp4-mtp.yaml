recipe_version: "2"
model: nvidia/Qwen3.8-Flash-Next-NVFP4
runtime: vllm-distributed
container: qwen38-flash-next-nvfp4-mtp-v1
min_nodes: 2
max_nodes: 2

metadata:
  description: NVIDIA Qwen3.8-Flash-Next NVFP4 with MTP3 on two DGX Sparks using TP2 and eager-mode vLLM

executor_config:
  entrypoint: ""
  # Avoid systemd RemoveIPC deleting rank-1's spawn semaphore when the
  # detached remote SSH launch exits.
  user: root

mods:
  - use-official-vllm

defaults:
  host: 0.0.0.0
  port: 8000
  served_model_name: Qwen3.8-Flash-Next-NVFP4
  tensor_parallel: 2
  gpu_memory_utilization: 0.835
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  kv_cache_dtype: auto
  load_format: safetensors
  attention_backend: flashinfer
  hf_overrides: '{"text_config":{"ple_embedding_dtype":"float8_e4m3fn"}}'
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  model_revision: fab0aecb760cec45227f6656abcaafa11abca87a
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'

env:
  OMP_NUM_THREADS: "1"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --safetensors-load-strategy lazy \
    --quantization modelopt \
    --enable-expert-parallel \
    --all2all-backend allgather_reducescatter \
    --mm-encoder-tp-mode data \
    --attention-backend {attention_backend} \
    --hf-overrides '{hf_overrides}' \
    --speculative-config '{speculative_config}' \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --no-enable-flashinfer-autotune \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --trust-remote-code \
    --enforce-eager
